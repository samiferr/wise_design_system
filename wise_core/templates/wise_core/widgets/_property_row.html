{% load i18n wise_icons %}
{% comment %}
One row of wise_core.widgets.PropertiesWidget's table: property | value |
action. A schema row's key is a <label> for its value; a free-form row has a
key input and a remove button. Included by properties.html for every row and
once more for the blank row inside its <template>.
{% endcomment %}
<tr class="property-row{% if row.invalid %} is-invalid{% endif %}" data-property-row{% if not row.fixed %} data-property-extra{% endif %}>
    <td class="property-key">
        {% if row.fixed %}
            <label class="property-key-label" for="{{ row.value_id }}">{{ row.label }}{% if row.required %}<span class="form-required">*</span>{% endif %}</label>
        {% else %}
            {{ row.key_html }}
        {% endif %}
    </td>
    <td class="property-value">
        {{ row.value_html }}
        {% if row.help_text %}<span class="helptext">{{ row.help_text|safe }}</span>{% endif %}
    </td>
    {% if has_actions %}
        <td class="property-action">
            {% if not row.fixed %}
                <button type="button" class="btn btn-icon btn-ghost" data-property-remove aria-label="{% translate 'Remove property' %}">{% lucide "trash-2" size="s" %}</button>
            {% endif %}
        </td>
    {% endif %}
</tr>
